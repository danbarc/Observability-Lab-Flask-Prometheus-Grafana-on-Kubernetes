apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: observability
  labels:
    app: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
      - name: flask
        image: flask-observability:latest
        imagePullPolicy: IfNotPresent   # importante no Minikube
        ports:
        - containerPort: 5000
        readinessProbe:
          httpGet:
            path: /
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10