apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-observability
  namespace: observability
data:
  observability-lab.json: |
    {
      "annotations": { "list": [] },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "Request Rate",
          "description": "Total HTTP requests per second",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total[1m]))",
              "legendFormat": "Requests/s"
            }
          ]
        },
        {
          "title": "Request Latency (p95)",
          "description": "95th percentile request duration",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": { "mode": "palette-classic" }
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le))",
              "legendFormat": "p95"
            }
          ]
        },
        {
          "title": "Node CPU Usage",
          "description": "Average CPU utilization across all cores",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 70 },
                  { "color": "red", "value": 90 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
              "legendFormat": "CPU %"
            }
          ]
        },
        {
          "title": "Available Memory",
          "description": "Percentage of memory available on the node",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "min": 0,
              "max": 100,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 20 },
                  { "color": "green", "value": 40 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes * 100",
              "legendFormat": "Available %"
            }
          ]
        },
        {
          "title": "5xx Error Rate",
          "description": "Rate of HTTP 5xx responses",
          "type": "timeseries",
          "gridPos": { "h": 7, "w": 24, "x": 0, "y": 16 },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "color": { "mode": "palette-classic" }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{status=~\"5..\"}[1m]))",
              "legendFormat": "5xx/s"
            }
          ]
        }
      ],
      "schemaVersion": 39,
      "tags": ["observability", "lab", "flask"],
      "templating": { "list": [] },
      "time": { "from": "now-15m", "to": "now" },
      "title": "Observability Lab – Flask Application",
      "uid": "observability-lab",
      "version": 2
    }